---
- name: Deploy Eyo to an existing Olamidepanel document root
  hosts: eyo:localhost
  become: true
  vars:
    repository_url: https://github.com/olamidebello/adamuorisha.git
    release_ref: main
    checkout_dir: /opt/eyo-spirit-source
    public_files:
      - index.html
      - style.css
      - game.js
      - assets/eyo-mark.svg
      - assets/lagos-procession-v1.png
      - assets/community-workshop-v1.png
  tasks:
    - name: Require an explicitly selected panel document root
      ansible.builtin.assert:
        that:
          - panel_document_root is defined
          - panel_document_root | length > 12
          - panel_document_root.startswith('/')
          - panel_document_root not in ['/', '/var/www', '/var/www/html', '/home']
        fail_msg: Set panel_document_root to the existing adamuorisha.africandroid.world document root shown by Olamidepanel.
    - name: Install Git
      ansible.builtin.package:
        name: git
        state: present
    - name: Pull selected revision
      ansible.builtin.git:
        repo: "{{ repository_url }}"
        dest: "{{ checkout_dir }}"
        version: "{{ release_ref }}"
        force: false
    - name: Verify document root already exists
      ansible.builtin.stat:
        path: "{{ panel_document_root }}"
      register: document_root
    - name: Refuse to invent a panel path
      ansible.builtin.assert:
        that:
          - document_root.stat.isdir | default(false)
    - name: Validate every source file before replacing live assets
      ansible.builtin.stat:
        path: "{{ checkout_dir }}/public/{{ item }}"
      register: source_assets
      loop: "{{ public_files }}"
    - name: Refuse an incomplete release
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - item.stat.size | default(0) > 0
      loop: "{{ source_assets.results }}"
      loop_control:
        label: "{{ item.item }}"
    - name: Ensure the public artwork directory exists
      ansible.builtin.file:
        path: "{{ panel_document_root }}/assets"
        state: directory
        mode: '0755'
    - name: Copy game assets with backups
      ansible.builtin.copy:
        src: "{{ checkout_dir }}/public/{{ item }}"
        dest: "{{ panel_document_root }}/{{ item }}"
        remote_src: true
        mode: '0644'
        backup: true
      loop: "{{ public_files }}"
    - name: Report deployed revision and destination
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ checkout_dir }}"
          - rev-parse
          - HEAD
      changed_when: false
      register: deployed_revision
    - name: Show deployment result
      ansible.builtin.debug:
        msg: "Deployed {{ deployed_revision.stdout }} to {{ panel_document_root }}. Verify https://adamuorisha.africandroid.world/ and its DNS/TLS in Olamidepanel."
