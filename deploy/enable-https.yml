---
- name: Enable verified HTTPS for Eyo without changing other websites
  hosts: localhost
  connection: local
  become: true
  vars:
    eyo_domain: adamuorisha.africandroid.world
    eyo_root: /var/www/eyo-spirit/public
    eyo_vhost: /etc/nginx/conf.d/eyo-spirit.conf
  tasks:
    - name: Read the working game configuration for rollback
      ansible.builtin.slurp:
        src: "{{ eyo_vhost }}"
      register: old_config
    - name: Require the existing dedicated Eyo configuration
      ansible.builtin.assert:
        that:
          - "'server_name ' + eyo_domain + ';' in (old_config.content | b64decode)"
          - "'root ' + eyo_root + ';' in (old_config.content | b64decode)"
    - name: Require an issued certificate matching this domain
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "/etc/letsencrypt/live/{{ eyo_domain }}/fullchain.pem"
          - -noout
          - -checkhost
          - "{{ eyo_domain }}"
      changed_when: false
      register: cert_check
      failed_when: cert_check.rc != 0 or 'does match certificate' not in cert_check.stdout
    - name: Require the certificate to be currently valid for at least one hour
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "/etc/letsencrypt/live/{{ eyo_domain }}/fullchain.pem"
          - -noout
          - -checkend
          - '3600'
      changed_when: false
    - name: Discover existing HTTP and HTTPS listener addresses
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, re, subprocess
            result = subprocess.run(["nginx", "-T"], capture_output=True, text=True, check=True)
            listeners = {"80": {"80", "127.0.0.1:80"}, "443": {"443", "127.0.0.1:443"}}
            for address in re.findall(r"(?m)^\s*listen\s+([^\s;]+)", result.stdout):
                for port in listeners:
                    if address == port or address.endswith(":" + port):
                        if address in ("*:" + port, "0.0.0.0:" + port):
                            address = port
                        if not re.fullmatch(r"\d+|(?:[0-9]{1,3}\.){3}[0-9]{1,3}:\d+|\[[0-9a-fA-F:]+\]:\d+", address):
                            raise SystemExit("Unsupported listener: " + address)
                        listeners[port].add(address)
            print(json.dumps({port: sorted(values) for port, values in listeners.items()}))
      changed_when: false
      register: discovered
    - name: Retain listener sets
      ansible.builtin.set_fact:
        eyo_listeners: "{{ discovered.stdout | from_json }}"
    - name: Configure and verify HTTPS with rollback
      block:
        - name: Write the dedicated game HTTP and HTTPS servers
          ansible.builtin.copy:
            dest: "{{ eyo_vhost }}"
            mode: '0644'
            backup: true
            content: |
              # Eyo game only. Other domains and the remote Apps Store are independent.
              server {
              {% for address in eyo_listeners['80'] %}
                  listen {{ address }};
              {% endfor %}
                  server_name {{ eyo_domain }};
                  root {{ eyo_root }};
                  location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
                  location / { return 301 https://{{ eyo_domain }}$request_uri; }
              }
              server {
              {% for address in eyo_listeners['443'] %}
                  listen {{ address }} ssl;
              {% endfor %}
                  server_name {{ eyo_domain }};
                  ssl_certificate /etc/letsencrypt/live/{{ eyo_domain }}/fullchain.pem;
                  ssl_certificate_key /etc/letsencrypt/live/{{ eyo_domain }}/privkey.pem;
                  ssl_protocols TLSv1.2 TLSv1.3;
                  root {{ eyo_root }};
                  index index.html;
                  location / { try_files $uri $uri/ =404; }
                  location ~ /\. { deny all; }
                  add_header X-Content-Type-Options nosniff;
                  add_header X-Eyo-Route static-v1 always;
              }
        - name: Validate Nginx before reload
          ansible.builtin.command: nginx -t
          changed_when: false
        - name: Reload Nginx
          ansible.builtin.service:
            name: nginx
            state: reloaded
        - name: Verify HTTPS certificate and exact game routing with SNI
          ansible.builtin.command:
            argv:
              - curl
              - --noproxy
              - '*'
              - --fail
              - --silent
              - --show-error
              - --max-time
              - '20'
              - --resolve
              - "{{ eyo_domain }}:443:127.0.0.1"
              - --dump-header
              - '-'
              - "https://{{ eyo_domain }}/"
          changed_when: false
          register: secure_page
          retries: 3
          delay: 2
          until: secure_page.rc == 0
        - name: Require Eyo page and routing marker over HTTPS
          ansible.builtin.assert:
            that:
              - "'<title>Eyo: Spirit of Lagos</title>' in secure_page.stdout"
              - "'x-eyo-route: static-v1' in (secure_page.stdout | lower)"
        - name: Verify every game asset over HTTPS with certificate checks enabled
          ansible.builtin.command:
            argv:
              - curl
              - --noproxy
              - '*'
              - --fail
              - --silent
              - --show-error
              - --max-time
              - '20'
              - --resolve
              - "{{ eyo_domain }}:443:127.0.0.1"
              - --output
              - /dev/null
              - "https://{{ eyo_domain }}/{{ item }}"
          loop:
            - style.css
            - game.js
            - assets/eyo-mark.svg
            - assets/lagos-procession-v1.png
            - assets/community-workshop-v1.png
          changed_when: false
      rescue:
        - name: Restore the previous game configuration
          ansible.builtin.copy:
            dest: "{{ eyo_vhost }}"
            content: "{{ old_config.content | b64decode }}"
            mode: '0644'
        - name: Validate restored Nginx configuration
          ansible.builtin.command: nginx -t
          changed_when: false
        - name: Reload previous game configuration
          ansible.builtin.service:
            name: nginx
            state: reloaded
        - name: Report the HTTPS failure
          ansible.builtin.fail:
            msg: "HTTPS verification failed; the previous game configuration was restored. Review the preceding error."
    - name: Report verified local HTTPS routing
      ansible.builtin.debug:
        msg: "HTTPS certificate, SNI routing, game page and all assets passed locally. Open https://{{ eyo_domain }}/ to confirm public DNS routing."
